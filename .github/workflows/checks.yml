name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: mise exec -- bun install --frozen-lockfile
      - run: mise exec -- bun lint
      - run: mise exec -- bun fmt --check
      - run: mise exec -- bun test
      - run: mise exec -- bun run build
      - run: mise exec -- bun run check
      - run: mise exec -- bun tools/native-parity.js
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: mise exec -- bun run test:browser chrome
        env:
          CHROME_PATH: /usr/bin/google-chrome
